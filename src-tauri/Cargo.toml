[package]
name = "prerna-core"
version = "0.1.0"
description = "PRERNA - Local-first AI guidance platform"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sqlcipher = { version = "0.6", features = ["bundled"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
keyring = "2.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
llama-cpp-2 = "0.1.154"

[features]
default = ["custom-protocol"]
custom-protocol = []
