name: Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Test Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm test -- --coverage
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-backend:
    name: Test Backend (Rust)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang libclang-dev libssl-dev
          
      - name: Create stub frontend dist for Tauri context
        run: mkdir -p dist && touch dist/index.html
          
      - name: Install Windows Dependencies (Perl & OpenSSL)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static-md
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
          
      - name: Setup Perl for Windows OpenSSL Build
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.32'

      - name: Configure Windows Clang Environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          if [ -d "C:/Program Files/Microsoft Visual Studio/2022" ]; then
            echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> "$GITHUB_ENV"
          fi
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: Cargo Fmt
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Cargo Check
        working-directory: ./src-tauri
        run: cargo check --locked
        
      - name: Cargo Clippy
        working-directory: ./src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        
      - name: Cargo Test
        working-directory: ./src-tauri
        run: cargo test --locked
        
      - name: Cargo Audit
        working-directory: ./src-tauri
        run: |
          cargo install cargo-audit || true
          cargo audit || true
