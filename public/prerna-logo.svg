<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <!-- Main Prism Gradient -->
    <linearGradient id="logoPrernaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Core Spark Gradient -->
    <linearGradient id="logoCoreSpark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Calming Turquoise Glow -->
    <linearGradient id="logoCalmAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow for the emblem -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Group (Centered at X=120, Y=120, scaled) -->
  <g transform="translate(10, 10) scale(0.43)">
    <!-- Sanctuary Perimeter Circle -->
    <circle cx="256" cy="256" r="195" stroke="url(#logoPrernaGrad)" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="6 8"/>
    <circle cx="256" cy="256" r="215" stroke="url(#logoCalmAura)" stroke-width="2" stroke-opacity="0.25"/>

    <!-- 4 Orbit Anchors -->
    <circle cx="256" cy="41" r="7" fill="#818CF8"/>
    <circle cx="471" cy="256" r="7" fill="#EC4899"/>
    <circle cx="256" cy="471" r="7" fill="#F43F5E"/>
    <circle cx="41" cy="256" r="7" fill="#06B6D4"/>

    <!-- Lotus Guidance Wings -->
    <path d="M256 380 C210 380 135 340 115 250 C100 180 145 130 195 145 C230 155 245 195 256 230 C242 190 220 170 195 168 C160 165 130 200 138 255 C150 320 215 350 256 355 Z" 
          fill="url(#logoPrernaGrad)" opacity="0.95"/>
    <path d="M256 380 C302 380 377 340 397 250 C412 180 367 130 317 145 C282 155 267 195 256 230 C270 190 292 170 317 168 C352 165 382 200 374 255 C362 320 297 350 256 355 Z" 
          fill="url(#logoPrernaGrad)" opacity="0.95"/>
    <path d="M190 320 C225 365 287 365 322 320 C340 345 315 390 256 395 C197 390 172 345 190 320 Z" 
          fill="url(#logoPrernaGrad)" opacity="0.75"/>

    <!-- Central Rays -->
    <path d="M256 95 L263 235 L256 256 L249 235 Z" fill="url(#logoCoreSpark)"/>
    <path d="M256 415 L263 277 L256 256 L249 277 Z" fill="url(#logoPrernaGrad)" opacity="0.8"/>
    <path d="M95 256 L235 249 L256 256 L235 263 Z" fill="url(#logoPrernaGrad)" opacity="0.85"/>
    <path d="M415 256 L277 249 L256 256 L277 263 Z" fill="url(#logoPrernaGrad)" opacity="0.85"/>

    <!-- Central Flame Spark -->
    <path d="M256 165 C268 205 284 235 284 260 C284 275 271 288 256 288 C241 288 228 275 228 260 C228 235 244 205 256 165 Z" 
          fill="url(#logoCoreSpark)"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="3.5" fill="#FDE047"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(250, 0)">
    <!-- Main Brandmark "PRERNA" -->
    <text x="0" y="132" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="6" 
          fill="url(#logoPrernaGrad)">PRERNA</text>

    <!-- Subtle Golden Diacritic Star Accent over the 'E' / 'R' -->
    <polygon points="128,52 131,61 140,61 133,66 135,75 128,70 121,75 123,66 116,61 125,61" 
             fill="url(#logoCoreSpark)"/>

    <!-- Tagline: Devanagari + English Philosophy Lockup -->
    <text x="4" y="172" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#94A3B8">
      प्रेरणा <tspan fill="#64748B">•</tspan> <tspan fill="#A855F7">INSPIRATION WITHIN</tspan>
    </text>

    <!-- Trust Pill Accent -->
    <text x="4" y="200" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#06B6D4">
      LOCAL-FIRST PRIVACY SANCTUARY
    </text>
  </g>
</svg>

